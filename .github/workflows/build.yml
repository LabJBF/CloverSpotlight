
name: Build CloverSpotlight

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build CloverSpotlight - Roothide
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          xcode-select -p
          xcodebuild -version

      - name: Install build dependencies
        run: |
          brew install dpkg ldid

      - name: Install RootHide Theos
        shell: bash
        run: |
          set -euo pipefail

          export THEOS="$RUNNER_TEMP/theos"
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"
          echo "$THEOS/bin" >> "$GITHUB_PATH"

          git clone --recursive \
            https://github.com/roothide/theos.git \
            "$THEOS"

          test -f "$THEOS/makefiles/common.mk"

          echo "RootHide Theos installed successfully."

      - name: Install iOS SDK
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$THEOS/sdks"

          SDK_ARCHIVE="$RUNNER_TEMP/iPhoneOS16.5.sdk.tar.xz"

          curl --fail --location \
            --retry 3 \
            --retry-all-errors \
            --output "$SDK_ARCHIVE" \
            https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS16.5.sdk.tar.xz

          tar -xJf "$SDK_ARCHIVE" -C "$THEOS/sdks"

          test -f "$THEOS/sdks/iPhoneOS16.5.sdk/SDKSettings.plist"

          echo "iOS 16.5 SDK installed successfully."

      - name: Verify build environment
        shell: bash
        run: |
          set -euo pipefail

          echo "Theos: $THEOS"
          echo "Available SDKs:"
          ls -la "$THEOS/sdks"

          test -f "$THEOS/makefiles/common.mk"
          test -d "$THEOS/sdks/iPhoneOS16.5.sdk"

          echo "Build environment ready."

      - name: Build Debian package
        shell: bash
        run: |
          set -euo pipefail

          make clean

          make package \
            FINALPACKAGE=1 \
            THEOS_PACKAGE_SCHEME=roothide

      - name: Verify Debian package
        shell: bash
        run: |
          set -euo pipefail

          shopt -s nullglob
          PACKAGES=(packages/*.deb)

          if [ ${#PACKAGES[@]} -eq 0 ]; then
            echo "ERROR: No Debian package was generated."
            exit 1
          fi

          for PACKAGE in "${PACKAGES[@]}"; do
            echo "--------------------------------"
            echo "Package: $PACKAGE"
            echo "--------------------------------"

            dpkg-deb --info "$PACKAGE"
            dpkg-deb --contents "$PACKAGE"

            echo "Architecture:"
            dpkg-deb -f "$PACKAGE" Architecture
          done

      - name: Upload Debian package
        uses: actions/upload-artifact@v4
        with:
          name: CloverSpotlight-Roothide
          path: packages/*.deb
          if-no-files-found: error
          retention-days: 14
