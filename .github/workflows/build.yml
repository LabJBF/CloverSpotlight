name: Build CloverSpotlight

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compile iOS Tweak
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          xcode-select -p
          xcodebuild -version

      - name: Install dependencies
        run: |
          brew install ldid

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git "$RUNNER_TEMP/theos"
          echo "THEOS=$RUNNER_TEMP/theos" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/theos/bin" >> "$GITHUB_PATH"

      - name: Prepare SDK directory
        run: |
          mkdir -p "$RUNNER_TEMP/theos/sdks"

      - name: Build Debian package
        run: |
          make clean
          make package FINALPACKAGE=1

      - name: Upload Debian package
        uses: actions/upload-artifact@v4
        with:
          name: CloverSpotlight-deb
          path: packages/*.deb
          if-no-files-found: error
          retention-days: 14
