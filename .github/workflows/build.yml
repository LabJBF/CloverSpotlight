
name: Build CloverSpotlight

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Roothide Package
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          xcode-select -p
          xcodebuild -version

      - name: Install dependencies
        run: |
          brew install dpkg ldid

      
      - name: Install RootHide Theos
        shell: bash
        run: |
          export THEOS="$RUNNER_TEMP/theos"
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"
          echo "$THEOS/bin" >> "$GITHUB_PATH"

          git clone --recursive https://github.com/roothide/theos.git "$THEOS"

      - name: Install iOS SDK
        shell: bash
        run: |
          mkdir -p "$THEOS/sdks"

          curl -fL \
            https://github.com/theos/sdks/releases/download/16.5/iPhoneOS16.5.sdk.tar.xz \
            -o "$RUNNER_TEMP/iPhoneOS16.5.sdk.tar.xz"

          tar -xJf "$RUNNER_TEMP/iPhoneOS16.5.sdk.tar.xz" \
            -C "$THEOS/sdks"

          test -d "$THEOS/sdks/iPhoneOS16.5.sdk"
          echo "iOS SDK installed successfully."

      - name: Verify Theos installation
        run: |
          test -f "$THEOS/makefiles/common.mk"
          test -d "$THEOS/sdks/iPhoneOS16.5.sdk"
          echo "RootHide Theos and SDK ready."

      - name: Build Debian package
        run: |
          make clean
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=roothide

      - name: Verify Debian package
        shell: bash
        run: |
          shopt -s nullglob
          packages=(packages/*.deb)

          if [ ${#packages[@]} -ne 1 ]; then
            echo "Expected exactly one .deb package."
            exit 1
          fi

          PACKAGE="${packages[0]}"

          echo "Package: $PACKAGE"
          dpkg-deb -f "$PACKAGE" Architecture
          dpkg-deb -c "$PACKAGE"

          ARCH="$(dpkg-deb -f "$PACKAGE" Architecture)"

          if [ "$ARCH" != "iphoneos-arm64e" ]; then
            echo "Incorrect package architecture: $ARCH"
            exit 1
          fi

      - name: Upload Debian package
        uses: actions/upload-artifact@v4
        with:
          name: CloverSpotlight-Roothide
          path: packages/*.deb
          if-no-files-found: error
          retention-days: 14
